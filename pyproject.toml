[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-tiendanova"
version = "0.1.0"
description = "Document-grounded support agent over a PDF corpus, with a deterministic pre-LLM router."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Joaquín A. Guzmán" }]

# Floor is 3.12: that is the default interpreter on Streamlit Community
# Cloud, our deployment target. CI additionally exercises 3.13 and 3.14,
# which Community Cloud also supports.
requires-python = ">=3.12"

dependencies = [
    "streamlit>=1.36",
    "pypdf>=4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-playwright>=0.5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.urls]
Repository = "https://github.com/joaquinalejandroguzman/agente-tiendanova"

# The project is still a flat set of top-level modules. Declaring them
# explicitly keeps `pip install -e .` working today; this list is replaced by
# a package discovery entry once the modules move under a package directory.
[tool.setuptools]
py-modules = ["app", "router", "doc_selector", "groq_client", "pdf_utils"]

# ---------------------------------------------------------------------------
# Ruff — linter and formatter (replaces flake8 + black + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort — import ordering
    "N",    # pep8-naming
    "UP",   # pyupgrade — modern syntax
    "B",    # flake8-bugbear — likely bugs
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib — os.path is legacy
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific rules
]
ignore = [
    # The product surface is Spanish on purpose (UI copy, LLM system prompt,
    # router replies). Ambiguous-unicode warnings fire on legitimate accented
    # characters and would be pure noise here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow names and use assertions freely.
"tests/**" = ["ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["app", "router", "doc_selector", "groq_client", "pdf_utils"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true

# Third-party packages without bundled type information.
[[tool.mypy.overrides]]
module = ["streamlit.*", "pypdf.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# End-to-end tests boot a real Streamlit server and drive a browser, so they
# are excluded from the default run and invoked explicitly via `make test-e2e`.
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end test driving a real browser against a running app (slow)",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
